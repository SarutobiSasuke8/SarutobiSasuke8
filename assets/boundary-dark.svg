<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 694" width="960" height="694" role="img" aria-label="Diagram: eight MCP servers form the boundary between an AI agent and the gated APIs, business databases, web and job sources, vault, CRM and other agents it must not hold directly.">
  <style>
    .ink   { fill: #e6edf3; }
    .muted { fill: #8d96a0; }
    .zone  { fill: #10151b; }
    .band  { fill: url(#g); }
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dash  { fill: none; stroke: #6e7681; stroke-width: 1.25; stroke-dasharray: 5 6; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl   { font-size: 10px; letter-spacing: 1.7px; }
    .flow  { fill: none; stroke-width: 1.5; opacity: .55; }
  </style>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#1c2128" stop-opacity="0"/>
      <stop offset=".18" stop-color="#1c2128" stop-opacity="1"/>
      <stop offset=".82" stop-color="#1c2128" stop-opacity="1"/>
      <stop offset="1"   stop-color="#1c2128" stop-opacity="0"/>
    </linearGradient>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a371f7"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4493f8"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/></marker>
  </defs>

  <rect class="zone" x="30" y="30" width="250" height="574" rx="12"/>
  <rect class="zone" x="700" y="30" width="230" height="574" rx="12"/>
  <rect class="band" x="380" y="30" width="200" height="574"/>
  <path class="dash" d="M 380 34 L 380 600"/>
  <path class="dash" d="M 580 34 L 580 600"/>

  <text class="t muted lbl" x="155" y="62" text-anchor="middle">AGENT SIDE</text>
  <text class="t muted lbl" x="480" y="62" text-anchor="middle">THE BOUNDARY</text>
  <text class="t muted lbl" x="815" y="62" text-anchor="middle">OUT OF REACH BY DEFAULT</text>

  <rect class="card" x="60" y="306" width="190" height="64" rx="8"/>
  <text class="t ink" x="155" y="334" font-size="13.5" font-weight="600" text-anchor="middle">MCP client</text>
  <text class="t muted" x="155" y="353" font-size="10.5" text-anchor="middle">Claude, Codex, any</text>

  <path class="flow" stroke="#a371f7" d="M 250 338 C 292 338 288 114 330 114"/>
  <path class="flow" stroke="#a371f7" marker-end="url(#mp)" d="M 630 114 L 742 114"/>
  <rect class="card" x="330" y="88" width="300" height="52" rx="8"/>
  <rect x="331" y="89" width="3" height="50" rx="1.5" fill="#a371f7"/>
  <text class="m ink" x="356" y="110" font-size="13" font-weight="600">credential-broker-mcp</text>
  <text class="t muted" x="356" y="128" font-size="10.5">use a key without ever holding it</text>
  <circle cx="752" cy="114" r="3.5" fill="#a371f7"/><text class="t ink" x="766" y="118" font-size="12.5">Gated APIs</text>

  <path class="flow" stroke="#a371f7" d="M 250 338 C 292 338 288 178 330 178"/>
  <path class="flow" stroke="#a371f7" marker-end="url(#mp)" d="M 630 178 L 742 178"/>
  <rect class="card" x="330" y="152" width="300" height="52" rx="8"/>
  <rect x="331" y="153" width="3" height="50" rx="1.5" fill="#a371f7"/>
  <text class="m ink" x="356" y="174" font-size="13" font-weight="600">astraeus-postgres-mcp</text>
  <text class="t muted" x="356" y="192" font-size="10.5">query data it can never write to</text>
  <circle cx="752" cy="178" r="3.5" fill="#a371f7"/><text class="t ink" x="766" y="182" font-size="12.5">Business databases</text>

  <path class="flow" stroke="#4493f8" d="M 250 338 C 292 338 288 242 330 242"/>
  <path class="flow" stroke="#4493f8" marker-end="url(#mb)" d="M 630 242 L 742 242"/>
  <rect class="card" x="330" y="216" width="300" height="52" rx="8"/>
  <rect x="331" y="217" width="3" height="50" rx="1.5" fill="#4493f8"/>
  <text class="m ink" x="356" y="238" font-size="13" font-weight="600">website-content-mcp</text>
  <text class="t muted" x="356" y="256" font-size="10.5">a site, as clean markdown</text>
  <circle cx="752" cy="242" r="3.5" fill="#4493f8"/><text class="t ink" x="766" y="246" font-size="12.5">The open web</text>

  <path class="flow" stroke="#4493f8" d="M 250 338 C 292 338 288 306 330 306"/>
  <path class="flow" stroke="#4493f8" marker-end="url(#mb)" d="M 630 306 L 742 306"/>
  <rect class="card" x="330" y="280" width="300" height="52" rx="8"/>
  <rect x="331" y="281" width="3" height="50" rx="1.5" fill="#4493f8"/>
  <text class="m ink" x="356" y="302" font-size="13" font-weight="600">source-pack-mcp</text>
  <text class="t muted" x="356" y="320" font-size="10.5">research carrying its own provenance</text>
  <circle cx="752" cy="306" r="3.5" fill="#4493f8"/><text class="t ink" x="766" y="310" font-size="12.5">Primary sources</text>

  <path class="flow" stroke="#4493f8" d="M 250 338 C 292 338 288 370 330 370"/>
  <path class="flow" stroke="#4493f8" marker-end="url(#mb)" d="M 630 370 L 742 370"/>
  <rect class="card" x="330" y="344" width="300" height="52" rx="8"/>
  <rect x="331" y="345" width="3" height="50" rx="1.5" fill="#4493f8"/>
  <text class="m ink" x="356" y="366" font-size="13" font-weight="600">jobscout-mcp</text>
  <text class="t muted" x="356" y="384" font-size="10.5">many sources, one deduplicated pool</text>
  <circle cx="752" cy="370" r="3.5" fill="#4493f8"/><text class="t ink" x="766" y="374" font-size="12.5">Job sources</text>

  <path class="flow" stroke="#3fb950" d="M 250 338 C 292 338 288 434 330 434"/>
  <path class="flow" stroke="#3fb950" marker-end="url(#mg)" d="M 630 434 L 742 434"/>
  <rect class="card" x="330" y="408" width="300" height="52" rx="8"/>
  <rect x="331" y="409" width="3" height="50" rx="1.5" fill="#3fb950"/>
  <text class="m ink" x="356" y="430" font-size="13" font-weight="600">obsidian-github-mcp</text>
  <text class="t muted" x="356" y="448" font-size="10.5">propose changes, never overwrite</text>
  <circle cx="752" cy="434" r="3.5" fill="#3fb950"/><text class="t ink" x="766" y="438" font-size="12.5">Vault on GitHub</text>

  <path class="flow" stroke="#3fb950" d="M 250 338 C 292 338 288 498 330 498"/>
  <path class="flow" stroke="#3fb950" marker-end="url(#mg)" d="M 630 498 L 742 498"/>
  <rect class="card" x="330" y="472" width="300" height="52" rx="8"/>
  <rect x="331" y="473" width="3" height="50" rx="1.5" fill="#3fb950"/>
  <text class="m ink" x="356" y="494" font-size="13" font-weight="600">meeting-context-router</text>
  <text class="t muted" x="356" y="512" font-size="10.5">meetings in, approved updates out</text>
  <circle cx="752" cy="498" r="3.5" fill="#3fb950"/><text class="t ink" x="766" y="502" font-size="12.5">CRM records</text>

  <path class="flow" stroke="#3fb950" d="M 250 338 C 292 338 288 562 330 562"/>
  <path class="flow" stroke="#3fb950" marker-end="url(#mg)" d="M 630 562 L 742 562"/>
  <rect class="card" x="330" y="536" width="300" height="52" rx="8"/>
  <rect x="331" y="537" width="3" height="50" rx="1.5" fill="#3fb950"/>
  <text class="m ink" x="356" y="558" font-size="13" font-weight="600">agent-handoff-mcp</text>
  <text class="t muted" x="356" y="576" font-size="10.5">bounded handoffs, every step audited</text>
  <circle cx="752" cy="562" r="3.5" fill="#3fb950"/><text class="t ink" x="766" y="566" font-size="12.5">Other agents</text>

  <rect x="60" y="620" width="10" height="10" rx="3" fill="#a371f7"/><text class="t muted" x="78" y="629" font-size="11.5">Reach</text>
  <rect x="150" y="620" width="10" height="10" rx="3" fill="#4493f8"/><text class="t muted" x="168" y="629" font-size="11.5">Read</text>
  <rect x="235" y="620" width="10" height="10" rx="3" fill="#3fb950"/><text class="t muted" x="253" y="629" font-size="11.5">Write and coordinate</text>
  <text class="t muted" x="930" y="629" font-size="11.5" text-anchor="end">Full board: mcprack.dev</text>
  <text class="t muted" x="60" y="660" font-size="12">The agent never holds the key, never writes unreviewed, never leaves without a trace.</text>
</svg>
