<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-label="Diagram: the path from repository to product. An MCP server is built, gated by mcp-eval-harness contract tests, hosted behind mcp-host-gateway, and listed on mcprack.dev.">
  <style>
    .ink   { fill: #e6edf3; }
    .muted { fill: #8d96a0; }
    .zone  { fill: #10151b; }
    .band  { fill: url(#g); }
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .dash  { fill: none; stroke: #6e7681; stroke-width: 1.25; stroke-dasharray: 5 6; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl   { font-size: 10px; letter-spacing: 1.7px; }
    .flow  { fill: none; stroke-width: 1.5; opacity: .55; }
  </style>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#1c2128" stop-opacity="0"/>
      <stop offset=".18" stop-color="#1c2128" stop-opacity="1"/>
      <stop offset=".82" stop-color="#1c2128" stop-opacity="1"/>
      <stop offset="1"   stop-color="#1c2128" stop-opacity="0"/>
    </linearGradient>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4493f8"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#f0883e"/></marker>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a371f7"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950"/></marker>
  </defs>

  <rect class="zone" x="20" y="24" width="920" height="222" rx="12"/>
  <text class="t muted lbl" x="40" y="54">FROM REPOSITORY TO PRODUCT</text>

  <rect class="card" x="40" y="70" width="196" height="146" rx="8"/>
  <rect x="41" y="71" width="194" height="3" rx="1.5" fill="#4493f8"/>
  <text class="t lbl" x="58" y="100" fill="#4493f8" font-weight="600">BUILD</text>
  <text class="t ink" x="58" y="124" font-size="13.5" font-weight="600">an MCP server</text>
  <circle cx="62" cy="154" r="2.5" fill="#4493f8"/>
  <text class="t muted" x="72" y="158" font-size="11">spec before code</text>
  <circle cx="62" cy="178" r="2.5" fill="#4493f8"/>
  <text class="t muted" x="72" y="182" font-size="11">AGENTS.md in the repo</text>
  <circle cx="62" cy="202" r="2.5" fill="#4493f8"/>
  <text class="t muted" x="72" y="206" font-size="11">unit tests in CI</text>
  <path class="flow" stroke="#f0883e" marker-end="url(#mo)" d="M 240 143 L 264 143"/>

  <rect class="card" x="268" y="70" width="196" height="146" rx="8"/>
  <rect x="269" y="71" width="194" height="3" rx="1.5" fill="#f0883e"/>
  <text class="t lbl" x="286" y="100" fill="#f0883e" font-weight="600">GATE</text>
  <text class="m ink" x="286" y="124" font-size="13.5" font-weight="600">mcp-eval-harness</text>
  <circle cx="290" cy="154" r="2.5" fill="#f0883e"/>
  <text class="t muted" x="300" y="158" font-size="11">golden fixtures</text>
  <circle cx="290" cy="178" r="2.5" fill="#f0883e"/>
  <text class="t muted" x="300" y="182" font-size="11">schema checks</text>
  <circle cx="290" cy="202" r="2.5" fill="#f0883e"/>
  <text class="t muted" x="300" y="206" font-size="11">fails the release on drift</text>
  <path class="flow" stroke="#a371f7" marker-end="url(#mp)" d="M 468 143 L 492 143"/>

  <rect class="card" x="496" y="70" width="196" height="146" rx="8"/>
  <rect x="497" y="71" width="194" height="3" rx="1.5" fill="#a371f7"/>
  <text class="t lbl" x="514" y="100" fill="#a371f7" font-weight="600">HOST</text>
  <text class="m ink" x="514" y="124" font-size="13.5" font-weight="600">mcp-host-gateway</text>
  <circle cx="518" cy="154" r="2.5" fill="#a371f7"/>
  <text class="t muted" x="528" y="158" font-size="11">JWT auth</text>
  <circle cx="518" cy="178" r="2.5" fill="#a371f7"/>
  <text class="t muted" x="528" y="182" font-size="11">plan per tool</text>
  <circle cx="518" cy="202" r="2.5" fill="#a371f7"/>
  <text class="t muted" x="528" y="206" font-size="11">rate limit, audit line</text>
  <path class="flow" stroke="#3fb950" marker-end="url(#mg)" d="M 696 143 L 720 143"/>

  <rect class="card" x="724" y="70" width="196" height="146" rx="8"/>
  <rect x="725" y="71" width="194" height="3" rx="1.5" fill="#3fb950"/>
  <text class="t lbl" x="742" y="100" fill="#3fb950" font-weight="600">LIST</text>
  <text class="m ink" x="742" y="124" font-size="13.5" font-weight="600">mcprack.dev</text>
  <circle cx="746" cy="154" r="2.5" fill="#3fb950"/>
  <text class="t muted" x="756" y="158" font-size="11">install commands</text>
  <circle cx="746" cy="178" r="2.5" fill="#3fb950"/>
  <text class="t muted" x="756" y="182" font-size="11">dated review evidence</text>
  <circle cx="746" cy="202" r="2.5" fill="#3fb950"/>
  <text class="t muted" x="756" y="206" font-size="11">machine-readable catalogue</text>

  <text class="t muted" x="40" y="232" font-size="12">A server that stops honouring its published contract does not ship.</text>
</svg>
