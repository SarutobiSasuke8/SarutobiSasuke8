<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-label="Diagram: six MCP servers form the boundary between an AI agent and the gated APIs, web sources, job sources, vault and other agents it must not hold directly.">
  <style>
    .ink   { fill: #1f2328; }
    .muted { fill: #656d76; }
    .zone  { fill: #f6f8fa; }
    .band  { fill: url(#g); }
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .dash  { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 5 6; }
    .t     { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lbl   { font-size: 10px; letter-spacing: 1.7px; }
    .flow  { fill: none; stroke-width: 1.5; opacity: .55; }
  </style>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#eaeef2" stop-opacity="0"/>
      <stop offset=".18" stop-color="#eaeef2" stop-opacity="1"/>
      <stop offset=".82" stop-color="#eaeef2" stop-opacity="1"/>
      <stop offset="1"   stop-color="#eaeef2" stop-opacity="0"/>
    </linearGradient>
    <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8250df"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0969da"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1a7f37"/></marker>
  </defs>

  <rect class="zone" x="30" y="30" width="250" height="470" rx="12"/>
  <rect class="zone" x="700" y="30" width="230" height="470" rx="12"/>
  <rect class="band" x="380" y="30" width="200" height="470"/>
  <path class="dash" d="M 380 34 L 380 496"/>
  <path class="dash" d="M 580 34 L 580 496"/>

  <text class="t muted lbl" x="155" y="62" text-anchor="middle">AGENT SIDE</text>
  <text class="t muted lbl" x="815" y="62" text-anchor="middle">OUT OF REACH BY DEFAULT</text>

  <rect class="card" x="60" y="250" width="190" height="64" rx="8"/>
  <text class="t ink" x="155" y="278" font-size="13.5" font-weight="600" text-anchor="middle">MCP client</text>
  <text class="t muted" x="155" y="297" font-size="10.5" text-anchor="middle">Claude, Codex, any</text>

  <g class="flow" stroke="#8250df"><path d="M 250 282 C 292 282 288 117 330 117"/></g>
  <g class="flow" stroke="#0969da">
    <path d="M 250 282 C 292 282 288 185 330 185"/>
    <path d="M 250 282 C 292 282 288 253 330 253"/>
    <path d="M 250 282 C 292 282 288 321 330 321"/>
  </g>
  <g class="flow" stroke="#1a7f37">
    <path d="M 250 282 C 292 282 288 389 330 389"/>
    <path d="M 250 282 C 292 282 288 457 330 457"/>
  </g>

  <g class="flow" stroke="#8250df" marker-end="url(#mp)"><path d="M 630 117 L 742 117"/></g>
  <g class="flow" stroke="#0969da" marker-end="url(#mb)">
    <path d="M 630 185 L 742 185"/>
    <path d="M 630 253 L 742 253"/>
    <path d="M 630 321 L 742 321"/>
  </g>
  <g class="flow" stroke="#1a7f37" marker-end="url(#mg)">
    <path d="M 630 389 L 742 389"/>
    <path d="M 630 457 L 742 457"/>
  </g>

  <g>
    <rect class="card" x="330" y="90" width="300" height="54" rx="8"/>
    <rect x="331" y="91" width="3" height="52" rx="1.5" fill="#8250df"/>
    <text class="m ink" x="356" y="113" font-size="13" font-weight="600">credential-broker-mcp</text>
    <text class="t muted" x="356" y="131" font-size="10.5">use a key without ever holding it</text>
  </g>
  <g>
    <rect class="card" x="330" y="158" width="300" height="54" rx="8"/>
    <rect x="331" y="159" width="3" height="52" rx="1.5" fill="#0969da"/>
    <text class="m ink" x="356" y="181" font-size="13" font-weight="600">website-content-mcp</text>
    <text class="t muted" x="356" y="199" font-size="10.5">a site, as clean markdown</text>
  </g>
  <g>
    <rect class="card" x="330" y="226" width="300" height="54" rx="8"/>
    <rect x="331" y="227" width="3" height="52" rx="1.5" fill="#0969da"/>
    <text class="m ink" x="356" y="249" font-size="13" font-weight="600">source-pack-mcp</text>
    <text class="t muted" x="356" y="267" font-size="10.5">research carrying its own provenance</text>
  </g>
  <g>
    <rect class="card" x="330" y="294" width="300" height="54" rx="8"/>
    <rect x="331" y="295" width="3" height="52" rx="1.5" fill="#0969da"/>
    <text class="m ink" x="356" y="317" font-size="13" font-weight="600">jobscout-mcp</text>
    <text class="t muted" x="356" y="335" font-size="10.5">many sources, one deduplicated pool</text>
  </g>
  <g>
    <rect class="card" x="330" y="362" width="300" height="54" rx="8"/>
    <rect x="331" y="363" width="3" height="52" rx="1.5" fill="#1a7f37"/>
    <text class="m ink" x="356" y="385" font-size="13" font-weight="600">obsidian-github-mcp</text>
    <text class="t muted" x="356" y="403" font-size="10.5">propose changes, never overwrite</text>
  </g>
  <g>
    <rect class="card" x="330" y="430" width="300" height="54" rx="8"/>
    <rect x="331" y="431" width="3" height="52" rx="1.5" fill="#1a7f37"/>
    <text class="m ink" x="356" y="453" font-size="13" font-weight="600">agent-handoff-mcp</text>
    <text class="t muted" x="356" y="471" font-size="10.5">bounded handoffs, every step audited</text>
  </g>

  <circle cx="752" cy="117" r="3.5" fill="#8250df"/><text class="t ink" x="766" y="121" font-size="12.5">Gated APIs</text>
  <circle cx="752" cy="185" r="3.5" fill="#0969da"/><text class="t ink" x="766" y="189" font-size="12.5">The open web</text>
  <circle cx="752" cy="253" r="3.5" fill="#0969da"/><text class="t ink" x="766" y="257" font-size="12.5">Primary sources</text>
  <circle cx="752" cy="321" r="3.5" fill="#0969da"/><text class="t ink" x="766" y="325" font-size="12.5">Job sources</text>
  <circle cx="752" cy="389" r="3.5" fill="#1a7f37"/><text class="t ink" x="766" y="393" font-size="12.5">Vault on GitHub</text>
  <circle cx="752" cy="457" r="3.5" fill="#1a7f37"/><text class="t ink" x="766" y="461" font-size="12.5">Other agents</text>

  <rect x="60" y="516" width="10" height="10" rx="3" fill="#8250df"/><text class="t muted" x="78" y="525" font-size="11.5">Reach</text>
  <rect x="150" y="516" width="10" height="10" rx="3" fill="#0969da"/><text class="t muted" x="168" y="525" font-size="11.5">Read</text>
  <rect x="235" y="516" width="10" height="10" rx="3" fill="#1a7f37"/><text class="t muted" x="253" y="525" font-size="11.5">Write and coordinate</text>

  <text class="t muted" x="60" y="556" font-size="12">The agent never holds the key, never writes unreviewed, never leaves without a trace.</text>
</svg>
